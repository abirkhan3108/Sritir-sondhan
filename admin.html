<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>স্মৃতি সংরক্ষণ — Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Bengali",
    sans-serif;
  background:#f3f7fc;
  color:#172033;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 3px 18px rgba(0,0,0,.08);
}

.header{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 3px 18px rgba(0,0,0,.08);
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

h1{
  margin:0;
  font-size:25px;
}

h2{
  margin:0 0 15px;
  font-size:21px;
}

.subtitle{
  color:#687386;
  margin-top:4px;
}

label{
  display:block;
  font-weight:700;
  margin:12px 0 6px;
}

input,
textarea,
button{
  font:inherit;
}

input,
textarea{
  width:100%;
  border:1px solid #d7dee8;
  border-radius:11px;
  padding:12px;
  outline:none;
  background:#fff;
}

input:focus,
textarea:focus{
  border-color:#1261d6;
  box-shadow:0 0 0 3px rgba(18,97,214,.10);
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  border-radius:11px;
  padding:11px 16px;
  font-weight:800;
  cursor:pointer;
}

.primary{
  background:#1261d6;
  color:#fff;
}

.secondary{
  background:#e9edf3;
  color:#222;
}

.danger{
  background:#df2944;
  color:#fff;
}

.success{
  color:#128548;
}

.error{
  color:#d7263d;
}

.hidden{
  display:none!important;
}

.message{
  min-height:24px;
  margin-top:12px;
  font-weight:700;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.stat{
  background:#f5f7fa;
  border-radius:14px;
  padding:16px;
  text-align:center;
}

.stat-number{
  display:block;
  font-size:29px;
  font-weight:900;
}

.stat-label{
  color:#687386;
  font-size:14px;
}

.search-row{
  display:flex;
  gap:8px;
}

.search-row input{
  flex:1;
}

.profile-item{
  border:1px solid #dce3ec;
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
  background:#fff;
}

.profile-name{
  font-size:20px;
  font-weight:900;
  margin-bottom:4px;
}

.profile-info{
  color:#687386;
  line-height:1.75;
  font-size:14px;
}

.profile-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
  flex-wrap:wrap;
}

.profile-actions button{
  min-width:110px;
}

.profile-photo{
  width:85px;
  height:85px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:10px;
  border:1px solid #ddd;
}

.photo-preview{
  width:130px;
  height:130px;
  object-fit:cover;
  border-radius:12px;
  margin-top:10px;
  display:none;
}

.login-box{
  max-width:500px;
  margin:45px auto;
}

/* Modal */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:#fff;
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  border-radius:18px;
  padding:20px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
}

.close-btn{
  background:#eee;
  color:#222;
  padding:8px 12px;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.modal-actions button{
  flex:1;
}

.loading{
  text-align:center;
  padding:20px;
  color:#687386;
}

@media(max-width:600px){

  .container{
    padding:10px;
  }

  .card,
  .header{
    padding:14px;
    border-radius:14px;
  }

  h1{
    font-size:22px;
  }

  .search-row{
    flex-direction:column;
  }

  .search-row button{
    width:100%;
  }

  .topbar{
    align-items:flex-start;
  }

  .profile-actions{
    flex-direction:row;
  }

  .profile-actions button{
    flex:1;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<!-- ================= ADMIN PANEL ================= -->

<main id="adminPanel" class="hidden">

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <div class="topbar">

      <div>
        <h1>স্মৃতি সংরক্ষণ</h1>

      </div>

      <button

      >
        Logout

    </div>

  </div>


  <!-- STATS -->

  <div class="card">

    <h2>📊 Dashboard</h2>

    <div class="stats">

        <span

      </div>

      <div class="stat">

        <span

        >

        <span class="stat-label">
          এই মাসে যোগ

    </div>

  </div>


  <!-- ADD PROFILE -->

    <h2>➕ নতুন Profile যোগ করুন</h2>

    <form id="profileForm">

      <label for="name">
        নাম *

      <input
        id="father_spouse"

        placeholder="পিতা / স্বামীর নাম"
      >

        গ্রাম
      </label>

      <input
        id="village"
        type="text"
        placeholder="গ্রামের নাম"

      <label for="age">

  <!-- SEARCH -->

    <div class="search-row">

      <input

<!-- ================= CONFIG ================= -->

<script src="config.js"></script>


<script>
"use strict";

/* =========================================================
   SUPABASE
========================================================= */

let db = null;

const TABLE = "profiles";

/*
  তোমার Supabase SQL অনুযায়ী আসল bucket:
  person-photos
*/
const BUCKET = "person-photos";


if (
  window.supabase &&
  window.SUPABASE_URL &&
  window.SUPABASE_ANON_KEY
) {

  db = window.supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_ANON_KEY
  );

}


/* =========================================================
   ELEMENTS
========================================================= */

const loginSection =
  document.getElementById("loginSection");

const adminPanel =
  document.getElementById("adminPanel");

const loginForm =
  document.getElementById("loginForm");

const loginMsg =
  document.getElementById("loginMsg");

const logoutBtn =
  document.getElementById("logoutBtn");

const profileForm =
  document.getElementById("profileForm");

const adminMsg =
  document.getElementById("adminMsg");

const adminProfiles =
  document.getElementById("adminProfiles");

const adminSearch =
  document.getElementById("adminSearch");

const adminSearchBtn =
  document.getElementById("adminSearchBtn");

const dashTotal =
  document.getElementById("dashTotal");

const dashMonthly =
  document.getElementById("dashMonthly");

const photoFile =
  document.getElementById("photoFile");

const photoPreview =
  document.getElementById("photoPreview");

const editModal =
  document.getElementById("editModal");

const editForm =
  document.getElementById("editForm");

const editMsg =
  document.getElementById("editMsg");

const editPhoto =
  document.getElementById("editPhoto");

const editPhotoPreview =
  document.getElementById("editPhotoPreview");

const editCurrentPhoto =
  document.getElementById("editCurrentPhoto");


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/[&<>"']/g, function(char) {

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[char];

    });

}


/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(value) {

  if (!value) {
    return "—";
  }

  const d = new Date(value + "T00:00:00");

  if (Number.isNaN(d.getTime())) {
    return escapeHTML(value);
  }

  return new Intl.DateTimeFormat(
    "bn-BD",
    {
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  ).format(d);

}


/* =========================================================
   MESSAGE
========================================================= */

function showAdminMessage(text, type) {

  adminMsg.textContent = text;

  adminMsg.className =
    "message " +
    (type === "error"
      ? "error"
      : "success");

}


/* =========================================================
   AUTH
========================================================= */

async function checkLogin() {

  if (!db) {

    loginMsg.textContent =
      "❌ Supabase config.js পাওয়া যাচ্ছে না।";

    loginSection.classList.remove("hidden");
    adminPanel.classList.add("hidden");

    return;
  }


  const {
    data,
    error
  } = await db.auth.getSession();


  if (error) {

    console.error(error);

    loginMsg.textContent =
      "❌ Session যাচাই করা যায়নি: " +
      error.message;

    return;
  }


  if (data.session) {

    loginSection.classList.add("hidden");

    adminPanel.classList.remove("hidden");

    await loadProfiles();

    await updateStats();

  } else {

    loginSection.classList.remove("hidden");

    adminPanel.classList.add("hidden");

  }

}


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
  "submit",
  async function(e) {

    e.preventDefault();

    loginMsg.textContent =
      "লগইন হচ্ছে...";

    if (!db) {

      loginMsg.textContent =
        "❌ Supabase config পাওয়া যাচ্ছে না।";

      return;
    }


    const email =
      document.getElementById("email")
      .value
      .trim();

    const password =
      document.getElementById("password")
      .value;


    const {
      error
    } =
      await db.auth.signInWithPassword({
        email,
        password
      });


    if (error) {

      loginMsg.textContent =
        "❌ " + error.message;

      return;
    }


    loginMsg.textContent =
      "✅ Login সফল";

    await checkLogin();

  }
);


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener(
  "click",
  async function() {

    if (db) {

      await db.auth.signOut();

    }

    adminPanel.classList.add("hidden");

    loginSection.classList.remove("hidden");

    loginMsg.textContent =
      "Logout হয়েছে।";

  }
);


/* =========================================================
   PHOTO PREVIEW
========================================================= */

photoFile.addEventListener(
  "change",
  function() {

    const file =
      photoFile.files &&
      photoFile.files[0];


    if (!file) {

      photoPreview.style.display = "none";

      photoPreview.removeAttribute("src");

      return;
    }


    if (file.size > 5 * 1024 * 1024) {

      alert(
        "ছবির সাইজ ৫ MB-এর মধ্যে রাখুন।"
      );

      photoFile.value = "";

      photoPreview.style.display = "none";

      return;
    }


    photoPreview.src =
      URL.createObjectURL(file);

    photoPreview.style.display =
      "block";

  }
);


/* =========================================================
   UPLOAD PHOTO
========================================================= */

async function uploadPhoto(file) {

  if (!file) {
    return null;
  }


  if (file.size > 5 * 1024 * 1024) {

    throw new Error(
      "ছবির সাইজ ৫ MB-এর মধ্যে রাখুন।"
    );

  }


  const extension =
    (
      file.name
        .split(".")
        .pop() || "jpg"
    )
    .toLowerCase();


  const path =
    "profiles/" +
    crypto.randomUUID() +
    "." +
    extension;


  const {
    error
  } =
    await db.storage
      .from(BUCKET)
      .upload(
        path,
        file,
        {
          upsert:false,
          contentType:file.type
        }
      );


  if (error) {
    throw error;
  }


  const {
    data
  } =
    db.storage
      .from(BUCKET)
      .getPublicUrl(path);


  return data.publicUrl;

}


/* =========================================================
   ADD PROFILE
========================================================= */

profileForm.addEventListener(
  "submit",
  async function(e) {

    e.preventDefault();

    showAdminMessage(
      "⏳ Profile সংরক্ষণ হচ্ছে...",
      "success"
    );


    try {

      if (!db) {
        throw new Error(
          "Supabase connection পাওয়া যায়নি।"
        );
      }


      const {
        data: sessionData
      } =
        await db.auth.getSession();


      if (!sessionData.session) {

        throw new Error(
          "আগে Admin Login করুন।"
        );

      }


      const name =
        document
          .getElementById("name")
          .value
          .trim();


      const father =
        document
          .getElementById("father_spouse")
          .value
          .trim();


      const village =
        document
          .getElementById("village")
          .value
          .trim();


      const ageText =
        document
          .getElementById("age")
          .value
          .trim();


      const reason =
        document
          .getElementById("death_reason")
          .value
          .trim();


      const deathDate =
        document
          .getElementById("death_date")
          .value;


      if (!name) {

        throw new Error(
          "নাম দিতে হবে।"
        );

      }


      const age =
        ageText
          ? Number(ageText)
          : null;


      let photoUrl = null;


      if (
        photoFile.files &&
        photoFile.files[0]
      ) {

        photoUrl =
          await uploadPhoto(
            photoFile.files[0]
          );

      }


      /*
        এখানে Supabase-এর আসল column name ব্যবহার করা হয়েছে।
      */

      const record = {

        name:name,

        father_spouse:
          father || null,

        village:
          village || null,

        age:age,

        death_reason:
          reason || null,

        death_date:
          deathDate || null,

        photo_url:
          photoUrl

      };


      const {
        error
      } =
        await db
          .from(TABLE)
          .insert(record);


      if (error) {
        throw error;
      }


      profileForm.reset();

      photoPreview.style.display =
        "none";

      photoPreview.removeAttribute(
        "src"
      );


      showAdminMessage(
        "✅ Profile সফলভাবে যোগ হয়েছে।",
        "success"
      );


      await loadProfiles(
        adminSearch.value.trim()
      );

      await updateStats();


    } catch(error) {

      console.error(error);

      showAdminMessage(
        "❌ " +
        (error.message || error),
        "error"
      );

    }

  }
);


/* =========================================================
   LOAD PROFILES
========================================================= */

async function
