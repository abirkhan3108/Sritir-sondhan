<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>স্মৃতি সংরক্ষণ — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 3px 18px rgba(0,0,0,.08);
}

h1{margin:0 0 5px;font-size:25px}
h2{margin-top:0;font-size:21px}

.subtitle{
  color:#667085;
}

label{
  display:block;
  margin:12px 0 6px;
  font-weight:700;
}

input,textarea,button{
  font:inherit;
}

input,textarea{
  width:100%;
  padding:13px;
  border:1px solid #d7dce5;
  border-radius:11px;
  background:white;
  outline:none;
}

textarea{
  min-height:90px;
  resize:vertical;
}

input:focus,textarea:focus{
  border-color:#1264d8;
}

button{
  border:0;
  border-radius:11px;
  padding:12px 18px;
  font-weight:800;
  cursor:pointer;
}

.primary{
  background:#0866d8;
  color:white;
}

.secondary{
  background:#e9edf3;
  color:#172033;
}

.danger{
  background:#df2945;
  color:white;
}

.success{
  color:#138a4b;
}

.error{
  color:#d9233e;
}

.hidden{
  display:none!important;
}

.message{
  min-height:24px;
  margin-top:12px;
  font-weight:700;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.profile{
  border:1px solid #dfe5ee;
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
  background:#fff;
}

.profile-name{
  font-size:21px;
  font-weight:900;
  margin-bottom:5px;
}

.profile-info{
  color:#667085;
  line-height:1.8;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:12px;
  flex-wrap:wrap;
}

.actions button{
  min-width:120px;
}

.photo{
  width:110px;
  height:110px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:10px;
  display:block;
}

.search{
  display:flex;
  gap:8px;
}

.search input{
  flex:1;
}

.empty{
  padding:20px;
  text-align:center;
  color:#667085;
}

.edit-box{
  background:#f7faff;
  border:2px solid #bcd7ff;
  border-radius:16px;
  padding:15px;
  margin-top:15px;
}

.login{
  max-width:500px;
  margin:50px auto;
}

@media(max-width:600px){
  .container{padding:10px}

  .topbar{
    align-items:flex-start;
  }

  .search{
    flex-direction:column;
  }

  .search button{
    width:100%;
  }

  .actions button{
    flex:1;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginSection">
  <div class="container login">
    <div class="card">

      <h1>🔐 Admin Login</h1>

      <p class="subtitle">
        স্মৃতি সংরক্ষণ — Admin Dashboard
      </p>

      <form id="loginForm">

        <label>Email</label>

        <input
          id="email"
          type="email"
          placeholder="Admin Email"
          required
        >

        <label>Password</label>

        <input
          id="password"
          type="password"
          placeholder="Password"
          required
        >

        <button
          type="submit"
          class="primary"
          style="width:100%;margin-top:16px"
        >
          🔐 Login
        </button>

      </form>

      <div id="loginMsg" class="message"></div>

    </div>
  </div>
</section>


<!-- ADMIN -->
<main id="adminPanel" class="hidden">

<div class="container">

  <!-- HEADER -->
  <div class="card">

    <div class="topbar">

      <div>
        <h1>স্মৃতি সংরক্ষণ</h1>
        <div class="subtitle">Admin Dashboard</div>
      </div>

      <button
        id="logoutBtn"
        class="secondary"
      >
        Logout
      </button>

    </div>

  </div>


  <!-- ADD PROFILE -->
  <div class="card">

    <h2>➕ নতুন Profile যোগ করুন</h2>

    <form id="profileForm">

      <label>নাম *</label>

      <input
        id="name"
        required
        placeholder="নাম লিখুন"
      >

      <label>পিতা / স্বামীর নাম</label>

      <input
        id="father"
        placeholder="পিতা / স্বামীর নাম"
      >

      <label>ঠিকানা / গ্রাম</label>

      <input
        id="address"
        placeholder="গ্রাম / ঠিকানা"
      >

      <label>বয়স</label>

      <input
        id="age"
        type="number"
        min="0"
        placeholder="বয়স"
      >

      <label>মৃত্যুর তারিখ</label>

      <input
        id="death_date"
        type="date"
      >

      <label>মৃত্যুর কারণ</label>

      <textarea
        id="death_reason"
        placeholder="মৃত্যুর কারণ"
      ></textarea>

      <label>ছবি</label>

      <input
        id="photoFile"
        type="file"
        accept="image/*"
      >

      <button
        type="submit"
        class="primary"
        style="width:100%;margin-top:16px"
      >
        💾 Profile সংরক্ষণ করুন
      </button>

    </form>

    <div id="adminMsg" class="message"></div>

  </div>


  <!-- SEARCH -->
  <div class="card">

    <h2>🔎 Profile Search</h2>

    <div class="search">

      <input
        id="adminSearch"
        placeholder="নাম দিয়ে খুঁজুন..."
      >

      <button
        id="adminSearchBtn"
        class="primary"
      >
        🔎 Search
      </button>

    </div>

  </div>


  <!-- PROFILES -->
  <div class="card">

    <h2>👥 Profiles</h2>

    <div id="adminProfiles">
      Profile লোড হচ্ছে...
    </div>

  </div>

</div>

</main>


<!-- CONFIG -->
<script src="config.js"></script>


<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

let client = null;

function getSupabaseClient(){

  if(client) return client;

  /*
   তোমার config.js-এ নিচের যেকোনো সাধারণ নাম থাকলেও
   সেটি ধরার চেষ্টা করবে।
  */

  const url =
    window.SUPABASE_URL ||
    window.supabaseUrl ||
    window.SUPABASE_PROJECT_URL;

  const key =
    window.SUPABASE_ANON_KEY ||
    window.supabaseKey ||
    window.SUPABASE_KEY ||
    window.SUPABASE_PUBLISHABLE_KEY;

  if(!url || !key){

    alert(
      "Supabase config পাওয়া যায়নি। config.js পরীক্ষা করুন।"
    );

    throw new Error(
      "Supabase URL অথবা Key পাওয়া যায়নি"
    );
  }

  client =
    window.supabase.createClient(url,key);

  return client;
}


/* =====================================================
   ELEMENTS
===================================================== */

const loginSection =
  document.getElementById("loginSection");

const adminPanel =
  document.getElementById("adminPanel");

const loginForm =
  document.getElementById("loginForm");

const loginMsg =
  document.getElementById("loginMsg");

const logoutBtn =
  document.getElementById("logoutBtn");

const profileForm =
  document.getElementById("profileForm");

const adminMsg =
  document.getElementById("adminMsg");

const adminProfiles =
  document.getElementById("adminProfiles");

const adminSearch =
  document.getElementById("adminSearch");

const adminSearchBtn =
  document.getElementById("adminSearchBtn");


/* =====================================================
   MESSAGE
===================================================== */

function message(el,text,type=""){

  el.textContent = text;

  el.className =
    "message " +
    (type==="error" ? "error" : "") +
    (type==="success" ? "success" : "");

}


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    message(
      loginMsg,
      "Login হচ্ছে..."
    );

    try{

      const sb = getSupabaseClient();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const {data,error} =
        await sb.auth.signInWithPassword({
          email,
          password
        });

      if(error)
        throw error;

      if(!data.session){

        throw new Error(
          "Login session তৈরি হয়নি।"
        );

      }

      loginSection.classList.add("hidden");

      adminPanel.classList.remove("hidden");

      await loadProfiles();

    }catch(error){

      console.error(error);

      message(
        loginMsg,
        "Login ব্যর্থ: " + error.message,
        "error"
      );

    }

  }
);


/* =====================================================
   LOGOUT
===================================================== */

logoutBtn.addEventListener(
  "click",
  async function(){

    try{

      const sb = getSupabaseClient();

      await sb.auth.signOut();

      adminPanel.classList.add("hidden");

      loginSection.classList.remove("hidden");

      loginForm.reset();

      adminProfiles.innerHTML = "";

    }catch(error){

      console.error(error);

    }

  }
);


/* =====================================================
   CHECK EXISTING SESSION
===================================================== */

async function checkSession(){

  try{

    const sb = getSupabaseClient();

    const {
      data:{
        session
      }
    } = await sb.auth.getSession();

    if(session){

      loginSection.classList.add("hidden");

      adminPanel.classList.remove("hidden");

      await loadProfiles();

    }else{

      loginSection.classList.remove("hidden");

      adminPanel.classList.add("hidden");

    }

  }catch(error){

    console.error(error);

    message(
      loginMsg,
      "Supabase connection সমস্যা: " +
      error.message,
      "error"
    );

  }

}


/* =====================================================
   ADD PROFILE
===================================================== */

profileForm.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    message(
      adminMsg,
      "Profile সংরক্ষণ হচ্ছে..."
    );

    try{

      const sb = getSupabaseClient();

      const {
        data:{
          user
        }
      } = await sb.auth.getUser();

      if(!user){

        throw new Error(
          "Admin login session পাওয়া যায়নি।"
        );

      }

      const name =
        document.getElementById("name")
        .value.trim();

      const father =
        document.getElementById("father")
        .value.trim();

      const address =
        document.getElementById("address")
        .value.trim();

      const ageValue =
        document.getElementById("age")
        .value;

      const death_date =
        document.getElementById("death_date")
        .value || null;

      const death_reason =
        document.getElementById("death_reason")
        .value.trim();

      const age =
        ageValue === ""
          ? null
          : Number(ageValue);

      const photoFile =
        document.getElementById("photoFile")
        .files[0];

      let photo_url = null;


      /*
       PHOTO UPLOAD

       যদি storage bucket "photos" থাকে,
       তাহলে ছবি আপলোড করবে।

       bucket না থাকলে profile save বন্ধ করবে না।
      */

      if(photoFile){

        try{

          const ext =
            photoFile.name
            .split(".")
            .pop();

          const fileName =
            Date.now() +
            "_" +
            Math.random()
            .toString(36)
            .substring(2) +
            "." +
            ext;

          const {
            error:uploadError
          } =
            await sb.storage
            .from("photos")
            .upload(
              fileName,
              photoFile,
              {
                upsert:false
              }
            );

          if(!uploadError){

            const {
              data:urlData
            } =
              sb.storage
              .from("photos")
              .getPublicUrl(fileName);

            photo_url =
              urlData.publicUrl;

          }else{

            console.warn(
              "Photo upload হয়নি:",
              uploadError.message
            );

          }

        }catch(photoError){

          console.warn(
            "Photo upload error:",
            photoError
          );

        }

      }


      const insertData = {

        name:name,

        father_husband:
          father || null,

        address:
          address || null,

        age:age,

        death_date:
          death_date,

        death_reason:
          death_reason || null,

        photo_url:
          photo_url

      };


      const {
        data,
        error
      } =
        await sb
        .from("profiles")
        .insert(insertData)
        .select()
        .single();


      if(error)
        throw error;


      message(
        adminMsg,
        "✅ Profile সফলভাবে যোগ হয়েছে।",
        "success"
      );

      profileForm.reset();

      await loadProfiles();

    }catch(error){

      console.error(error);

      message(
        adminMsg,
        "❌ Profile যোগ হয়নি: " +
        error.message,
        "error"
      );

    }

  }
);


/* =====================================================
   LOAD PROFILES
===================================================== */

async function loadProfiles(){

  adminProfiles.innerHTML =
    "<p>Profile লোড হচ্ছে...</p>";

  try{

    const sb = getSupabaseClient();

    const {
      data,
      error
    } =
      await sb
      .from("profiles")
      .select("*")
      .order("id",{ascending:false});

    if(error)
      throw error;

    window.allProfiles =
      data || [];

    renderProfiles(
      window.allProfiles
    );

  }catch(error){

    console.error(error);

    adminProfiles.innerHTML = `
      <div class="empty">
        ❌ Profile লোড করা যায়নি।
        <br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

  }

}


/* =====================================================
   RENDER
===================================================== */

function renderProfiles(list){

  if(!list.length){

    adminProfiles.innerHTML =
      '<div class="empty">কোনো Profile পাওয়া যায়নি।</div>';

    return;

  }


  adminProfiles.innerHTML =
    list.map(function(p){

      const father =
        p.father_husband ||
        p.father ||
        "—";

      const address =
        p.address ||
        p.village ||
        "—";

      const age =
        p.age == null
          ? "—"
          : p.age + " বছর";

      const date =
        p.death_date ||
        "—";

      const cause =
        p.death_reason ||
        p.death_cause ||
        "";


      return `

        <div class="profile">

          ${
            p.photo_url
            ?
            `<img
              class="photo"
              src="${escapeAttr(p.photo_url)}"
              alt="${escapeAttr(p.name || "")}"
              onerror="this.style.display='none'"
            >`
            :
            ""
          }

          <div class="profile-name">
            ${escapeHtml(p.name || "নাম নেই")}
          </div>

          <div class="profile-info">

            পিতা/স্বামী:
            ${escapeHtml(father)}
            <br>

            ঠিকানা:
            ${escapeHtml(address)}
            <br>

            বয়স:
            ${escapeHtml(age)}
            <br>

            মৃত্যুর তারিখ:
            ${escapeHtml(date)}

            ${
              cause
              ?
              `<br>মৃত্যুর কারণ:
               ${escapeHtml(cause)}`
              :
              ""
            }

          </div>


          <div class="actions">

            <button
              class="primary"
              onclick="editProfile('${escapeAttr(String(p.id))}')"
            >
              ✏️ Edit
            </button>

            <button
              class="danger"
              onclick="deleteProfile('${escapeAttr(String(p.id))}')"
            >
              🗑️ Delete
            </button>

          </div>


          <div
            id="edit-${escapeAttr(String(p.id))}"
            class="edit-box hidden"
          >

            <label>নাম</label>

            <input
              id="edit-name-${escapeAttr(String(p.id))}"
              value="${escapeAttr(p.name || "")}"
            >

            <label>পিতা / স্বামী</label>

            <input
              id="edit-father-${escapeAttr(String(p.id))}"
              value="${escapeAttr(father === "—" ? "" : father)}"
            >

            <label>ঠিকানা</label>

            <input
              id="edit-address-${escapeAttr(String(p.id))}"
              value="${escapeAttr(address === "—" ? "" : address)}"
            >

            <label>বয়স</label>

            <input
              id="edit-age-${escapeAttr(String(p.id))}"
              type="number"
              value="${p.age == null ? "" : escapeAttr(String(p.age))}"
            >

            <label>মৃত্যুর তারিখ</label>

            <input
              id="edit-date-${escapeAttr(String(p.id))}"
              type="date"
              value="${escapeAttr(p.death_date || "")}"
            >

            <label>মৃত্যুর কারণ</label>

            <textarea
              id="edit-cause-${escapeAttr(String(p.id))}"
            >${escapeHtml(cause)}</textarea>


            <div class="actions">

              <button
                class="primary"
                onclick="saveEdit('${escapeAttr(String(p.id))}')"
              >
                💾 Save Changes
              </button>

              <button
                class="secondary"
                onclick="cancelEdit('${escapeAttr(String(p.id))}')"
              >
                Cancel
              </button>

            </div>

          </div>

        </div>

      `;

    }).join("");

}


/* =====================================================
   EDIT PROFILE
===================================================== */

window.editProfile =
function(id){

  const box =
    document.getElementById(
      "edit-" + id
    );

  if(!box)
    return;

  box.classList.toggle("hidden");

};


/* =====================================================
   CANCEL EDIT
===================================================== */

window.cancelEdit =
function(id){

  const box =
    document.getElementById(
      "edit-" + id
    );

  if(box)
    box.classList.add("hidden");

};


/* =====================================================
   SAVE EDIT
===================================================== */

window.saveEdit =
async function(id){

  try{

    const sb = getSupabaseClient();


    const name =
      document.getElementById(
        "edit-name-" + id
      ).value.trim();

    if(!name){

      alert("নাম দিতে হবে।");

      return;

    }


    const father =
      document.getElementById(
        "edit-father-" + id
      ).value.trim();


    const address =
      document.getElementById(
        "edit-address-" + id
      ).value.trim();


    const ageValue =
      document.getElementById(
        "edit-age-" + id
      ).value;


    const date =
      document.getElementById(
        "edit-date-" + id
      ).value || null;


    const cause =
      document.getElementById(
        "edit-cause-" + id
      ).value.trim();


    const age =
      ageValue === ""
        ? null
        : Number(ageValue);


    const updateData = {

      name:name,

      father_husband:
        father || null,

      address:
        address || null,

      age:age,

      death_date:
        date,

      death_reason:
        cause || null

    };


    const {
      data,
      error
    } =
      await sb
      .from("profiles")
      .update(updateData)
      .eq("id",id)
      .select();


    if(error)
      throw error;


    if(!data || !data.length){

      throw new Error(
        "Update হয়েছে বলে Supabase কোনো row ফেরত দেয়নি। RLS policy পরীক্ষা করুন।"
      );

    }


    alert(
      "✅ Profile সফলভাবে Update হয়েছে।"
    );


    await loadProfiles();

  }catch(error){

    console.error(error);

    alert(
      "❌ Edit/Update সমস্যা:\n\n" +
      error.me
