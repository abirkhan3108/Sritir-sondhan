<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>স্মৃতি সংরক্ষণ — Admin Dashboard</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans Bengali",
        sans-serif;

      background: #f4f6f8;
      color: #222;

      -webkit-tap-highlight-color: transparent;
    }


    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 14px;
    }


    .card {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;

      box-shadow:
        0 3px 15px rgba(0,0,0,.08);
    }


    h1 {
      margin: 0 0 5px;
      font-size: 24px;
    }


    h2 {
      margin: 0 0 14px;
      font-size: 20px;
    }


    .subtitle {
      color: #666;
      font-size: 14px;
    }


    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: 700;
    }


    input,
    textarea,
    button {
      font: inherit;
    }


    input,
    textarea {
      width: 100%;

      padding: 13px;

      border:
        1px solid #d5d9de;

      border-radius: 11px;

      background: #fff;

      outline: none;
    }


    input:focus,
    textarea:focus {
      border-color: #222;
    }


    textarea {
      min-height: 90px;
      resize: vertical;
    }


    button {
      border: 0;
      border-radius: 11px;

      padding: 13px 17px;

      font-weight: 700;

      cursor: pointer;

      -webkit-user-select: none;
      user-select: none;

      touch-action: manipulation;
    }


    button:active {
      transform: scale(.98);
    }


    .primary {
      background: #222;
      color: #fff;
    }


    .secondary {
      background: #e9ecef;
      color: #222;
    }


    .danger {
      background: #d7263d;
      color: #fff;
    }


    .edit-btn {
      background: #1261d6;
      color: #fff;
    }


    .success {
      color: #168a4a;
    }


    .error {
      color: #d7263d;
    }


    .hidden {
      display: none !important;
    }


    .message {
      min-height: 24px;
      margin-top: 12px;
      font-weight: 700;
    }


    /* HEADER */

    .header {
      background: #fff;

      border-radius: 16px;

      padding: 18px;

      margin-bottom: 16px;

      box-shadow:
        0 3px 15px rgba(0,0,0,.08);
    }


    .topbar {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 12px;
    }


    /* LOGIN */

    .login-box {
      max-width: 500px;
      margin: 45px auto;
    }


    /* STATS */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 12px;
    }


    .stat {
      background: #f7f7f7;

      border-radius: 13px;

      padding: 16px;

      text-align: center;
    }


    .stat-number {
      display: block;

      font-size: 28px;

      font-weight: 800;
    }


    .stat-label {
      color: #666;

      font-size: 13px;
    }


    /* SEARCH */

    .search-row {
      display: flex;

      gap: 10px;
    }


    .search-row input {
      flex: 1;
    }


    /* PROFILE */

    .profile-item {
      background: #fafafa;

      border:
        1px solid #e2e5e8;

      border-radius: 14px;

      padding: 15px;

      margin-bottom: 13px;
    }


    .profile-name {
      font-size: 19px;

      font-weight: 800;

      margin-bottom: 5px;
    }


    .profile-info {
      color: #666;

      font-size: 14px;

      line-height: 1.7;

      margin-bottom: 12px;
    }


    /*
      IMPORTANT:
      Edit/Delete button দুটো
      সম্পূর্ণ আলাদা।
    */

    .profile-actions {
      display: flex;

      width: 100%;

      gap: 10px;
    }


    .profile-actions button {
      flex: 1;

      min-height: 52px;

      font-size: 16px;

      touch-action: manipulation;
    }


    .photo-preview {
      display: none;

      margin-top: 10px;

      width: 140px;
      height: 140px;

      object-fit: cover;

      border-radius: 12px;

      border:
        1px solid #ddd;
    }


    /* MOBILE */

    @media (max-width: 600px) {

      .container {
        padding: 10px;
      }


      .card,
      .header {
        padding: 14px;

        border-radius: 13px;
      }


      h1 {
        font-size: 22px;
      }


      h2 {
        font-size: 19px;
      }


      .topbar {
        align-items: flex-start;
      }


      .search-row {
        flex-direction: column;
      }


      .search-row button {
        width: 100%;
      }


      .profile-actions {
        gap: 8px;
      }


      .profile-actions button {
        min-height: 54px;

        font-size: 16px;
      }

    }

  </style>
</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginSection">

  <div class="container login-box">

    <div class="card">

      <h1>🔐 Admin Login</h1>

      <p class="subtitle">
        স্মৃতি সংরক্ষণ — Admin Dashboard
      </p>


      <form id="loginForm">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          placeholder="Admin Email"
          autocomplete="username"
          required
        >


        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >


        <button
          type="submit"
          class="primary"
          style="
            width:100%;
            margin-top:16px;
          "
        >
          🔐 Login
        </button>

      </form>


      <div
        id="loginMsg"
        class="message"
      ></div>

    </div>

  </div>

</section>



<!-- =====================================================
     ADMIN PANEL
===================================================== -->

<main
  id="adminPanel"
  class="hidden"
>

  <div class="container">


    <!-- HEADER -->

    <div class="header">

      <div class="topbar">

        <div>

          <h1>
            স্মৃতি সংরক্ষণ
          </h1>

          <div class="subtitle">
            Admin Dashboard
          </div>

        </div>


        <button
          id="logoutBtn"
          type="button"
          class="secondary"
        >
          Logout
        </button>

      </div>

    </div>



    <!-- =================================================
         DASHBOARD
    ================================================= -->

    <div class="card">

      <h2>
        📊 Dashboard
      </h2>


      <div class="stats">

        <div class="stat">

          <span
            id="dashTotal"
            class="stat-number"
          >
            0
          </span>

          <span class="stat-label">
            মোট Profile
          </span>

        </div>


        <div class="stat">

          <span
            id="dashMonthly"
            class="stat-number"
          >
            0
          </span>

          <span class="stat-label">
            এই মাসে যোগ
          </span>

        </div>

      </div>

    </div>



    <!-- =================================================
         ADD PROFILE
    ================================================= -->

    <div class="card">

      <h2>
        ➕ নতুন Profile যোগ করুন
      </h2>


      <form id="profileForm">


        <label for="name">
          নাম *
        </label>

        <input
          id="name"
          name="name"
          type="text"
          placeholder="নাম লিখুন"
          required
        >


        <label for="father">
          পিতা / স্বামীর নাম
        </label>

        <input
          id="father"
          name="father"
          type="text"
          placeholder="পিতা / স্বামীর নাম"
        >


        <label for="village">
          গ্রাম
        </label>

        <input
          id="village"
          name="village"
          type="text"
          placeholder="গ্রামের নাম"
        >


        <label for="age">
          বয়স
        </label>

        <input
          id="age"
          name="age"
          type="number"
          min="0"
          placeholder="বয়স"
        >


        <label for="death_reason">
          মৃত্যুর কারণ
        </label>

        <textarea
          id="death_reason"
          name="death_reason"
          placeholder="মৃত্যুর কারণ লিখুন"
        ></textarea>


        <label for="date">
          মৃত্যুর তারিখ
        </label>

        <input
          id="date"
          name="date"
          type="date"
        >


        <label for="photoFile">
          ছবি
        </label>

        <input
          id="photoFile"
          name="photoFile"
          type="file"
          accept="image/*"
        >


        <img
          id="photoPreview"
          class="photo-preview"
          alt="Photo preview"
        >


        <button
          type="submit"
          class="primary"
          style="
            width:100%;
            margin-top:16px;
          "
        >
          💾 Profile সংরক্ষণ করুন
        </button>

      </form>


      <div
        id="adminMsg"
        class="message"
      ></div>

    </div>



    <!-- =================================================
         SEARCH
    ================================================= -->

    <div class="card">

      <h2>
        🔎 Profile Search
      </h2>


      <div class="search-row">

        <input
          id="adminSearch"
          type="search"
          placeholder="নাম দিয়ে খুঁজুন..."
          autocomplete="off"
        >


        <button
          id="adminSearchBtn"
          type="button"
          class="primary"
        >
          🔎 Search
        </button>

      </div>

    </div>



    <!-- =================================================
         PROFILE LIST
    ================================================= -->

    <div class="card">

      <h2>
        👥 Profiles
      </h2>


      <div id="adminProfiles">

        <p>
          Profile লোড হচ্ছে...
        </p>

      </div>

    </div>


  </div>

</main>



<!-- =====================================================
     CONFIG
===================================================== -->

<script src="config.js"></script>


<!-- =====================================================
     PHOTO PREVIEW
===================================================== -->

<script>

  const photoInput =
    document.getElementById(
      "photoFile"
    );

  const photoPreview =
    document.getElementById(
      "photoPreview"
    );


  if (
    photoInput &&
    photoPreview
  ) {

    photoInput.addEventListener(
      "change",
      function () {

        const file =
          photoInput.files &&
          photoInput.files[0];


        if (!file) {

          photoPreview.style.display =
            "none";

          photoPreview.removeAttribute(
            "src"
          );

          return;
        }


        const url =
          URL.createObjectURL(
            file
          );


        photoPreview.src = url;

        photoPreview.style.display =
          "block";

      }
    );

  }

</script>



<!-- =====================================================
     ADMIN JS
===================================================== -->

<script src="admin.js"></script>


</body>
</html>
