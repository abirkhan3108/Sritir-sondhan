<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>স্মৃতি সংরক্ষণ — Admin Dashboard</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans Bengali",
        sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 18px;
    }

    .header {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 5px;
      font-size: 25px;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input,
    textarea,
    button {
      font: inherit;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d5d9de;
      border-radius: 10px;
      outline: none;
      background: #fff;
    }

    input:focus,
    textarea:focus {
      border-color: #333;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 700;
    }

    .primary {
      background: #222;
      color: white;
    }

    .secondary {
      background: #e9ecef;
      color: #222;
    }

    .danger {
      background: #d7263d;
      color: #fff;
    }

    .success {
      color: #168a4a;
    }

    .error {
      color: #d7263d;
    }

    .hidden {
      display: none !important;
    }

    .message {
      margin-top: 12px;
      font-weight: 600;
      min-height: 22px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat {
      background: #f7f7f7;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .stat-number {
      display: block;
      font-size: 28px;
      font-weight: 800;
    }

    .stat-label {
      color: #666;
      font-size: 13px;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-row input {
      flex: 1;
    }

    .profile-item {
      background: #fafafa;
      border: 1px solid #e2e5e8;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .profile-name {
      font-size: 18px;
      font-weight: 800;
    }

    .profile-info {
      margin-top: 5px;
      color: #666;
      font-size: 14px;
      line-height: 1.7;
    }

    .profile-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .login-box {
      max-width: 500px;
      margin: 50px auto;
    }

    .photo-preview {
      margin-top: 10px;
      max-width: 150px;
      max-height: 150px;
      border-radius: 12px;
      display: none;
      object-fit: cover;
    }

    @media (max-width: 600px) {
      .container {
        padding: 10px;
      }

      .header,
      .card {
        padding: 14px;
        border-radius: 13px;
      }

      h1 {
        font-size: 22px;
      }

      .search-row {
        flex-direction: column;
      }

      .search-row button {
        width: 100%;
      }

      .topbar {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       LOGIN
       ===================================================== -->

  <section id="loginSection">
    <div class="container login-box">

      <div class="card">

        <h1>🔐 Admin Login</h1>

        <p class="subtitle">
          স্মৃতি সংরক্ষণ — Admin Dashboard
        </p>

        <form id="loginForm">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            placeholder="Admin Email"
            autocomplete="username"
            required
          >

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            required
          >

          <button
            type="submit"
            class="primary"
            style="width:100%;margin-top:16px;"
          >
            Login
          </button>

        </form>

        <div
          id="loginMsg"
          class="message"
        ></div>

      </div>

    </div>
  </section>


  <!-- =====================================================
       ADMIN PANEL
       ===================================================== -->

  <main
    id="adminPanel"
    class="hidden"
  >

    <div class="container">

      <!-- Header -->

      <div class="header">

        <div class="topbar">

          <div>
            <h1>স্মৃতি সংরক্ষণ</h1>

            <div class="subtitle">
              Admin Dashboard
            </div>
          </div>

          <button
            id="logoutBtn"
            type="button"
            class="secondary"
          >
            Logout
          </button>

        </div>

      </div>


      <!-- =================================================
           STATS
           ================================================= -->

      <div class="card">

        <h2>📊 Dashboard</h2>

        <div class="stats">

          <div class="stat">

            <span
              id="dashTotal"
              class="stat-number"
            >
              0
            </span>

            <span class="stat-label">
              মোট Profile
            </span>

          </div>

          <div class="stat">

            <span
              id="dashMonthly"
              class="stat-number"
            >
              0
            </span>

            <span class="stat-label">
              এই মাসে যোগ
            </span>

          </div>

        </div>

      </div>


      <!-- =================================================
           ADD PROFILE
           ================================================= -->

      <div class="card">

        <h2>➕ নতুন Profile যোগ করুন</h2>

        <form id="profileForm">

          <label for="name">
            নাম *
          </label>

          <input
            id="name"
            name="name"
            type="text"
            placeholder="নাম লিখুন"
            required
          >


          <label for="father">
            পিতা / স্বামীর নাম
          </label>

          <input
            id="father"
            name="father"
            type="text"
            placeholder="পিতা / স্বামীর নাম"
          >


          <label for="village">
            গ্রাম
          </label>

          <input
            id="village"
            name="village"
            type="text"
            placeholder="গ্রামের নাম"
          >


          <label for="age">
            বয়স
          </label>

          <input
            id="age"
            name="age"
            type="number"
            min="0"
            placeholder="বয়স"
          >


          <label for="death_reason">
            মৃত্যুর কারণ
          </label>

          <textarea
            id="death_reason"
            name="death_reason"
            placeholder="মৃত্যুর কারণ লিখুন"
          ></textarea>


          <label for="date">
            মৃত্যুর তারিখ
          </label>

          <input
            id="date"
            name="date"
            type="date"
          >


          <label for="photoFile">
            ছবি
          </label>

          <input
            id="photoFile"
            name="photoFile"
            type="file"
            accept="image/*"
          >

          <img
            id="photoPreview"
            class="photo-preview"
            alt="Photo preview"
          >


          <button
            type="submit"
            class="primary"
            style="margin-top:16px;width:100%;"
          >
            💾 Profile সংরক্ষণ করুন
          </button>

        </form>

        <div
          id="adminMsg"
          class="message"
        ></div>

      </div>


      <!-- =================================================
           SEARCH
           ================================================= -->

      <div class="card">

        <h2>🔎 Profile Search</h2>

        <div class="search-row">

          <input
            id="adminSearch"
            type="search"
            placeholder="নাম দিয়ে খুঁজুন..."
          >

          <button
            id="adminSearchBtn"
            type="button"
            class="primary"
          >
            Search
          </button>

        </div>

      </div>


      <!-- =================================================
           PROFILE LIST
           ================================================= -->

      <div class="card">

        <h2>👥 Profiles</h2>

        <div id="adminProfiles">

          <p>
            Profile লোড হচ্ছে...
          </p>

        </div>

      </div>

    </div>

  </main>


  <!-- =====================================================
       CONFIG
       ===================================================== -->

  <script src="config.js"></script>

  <!-- =====================================================
       PHOTO PREVIEW
       ===================================================== -->

  <script>

    const photoInput =
      document.getElementById("photoFile");

    const photoPreview =
      document.getElementById("photoPreview");

    if (photoInput && photoPreview) {

      photoInput.addEventListener(
        "change",
        function () {

          const file =
            photoInput.files &&
            photoInput.files[0];

          if (!file) {

            photoPreview.style.display =
              "none";

            photoPreview.removeAttribute(
              "src"
            );

            return;
          }

          const url =
            URL.createObjectURL(file);

          photoPreview.src = url;

          photoPreview.style.display =
            "block";
        }
      );
    }

  </script>


  <!-- =====================================================
       ADMIN JS
       ===================================================== -->

  <script src="admin.js"></script>

</body>
</html>
