<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>স্মৃতি সংরক্ষণ — Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  background:#f4f6f8;
  color:#20242a;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Bengali",
    sans-serif;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:14px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

h1{
  margin:0 0 5px;
  font-size:25px;
}

h2{
  margin:0 0 15px;
  font-size:20px;
}

.subtitle{
  color:#68707b;
  font-size:14px;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:6px;
  font-weight:700;
}

input,
textarea,
button{
  font:inherit;
}

input,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #d5dbe3;
  border-radius:11px;
  outline:none;
  background:#fff;
}

textarea{
  min-height:90px;
  resize:vertical;
}

input:focus,
textarea:focus{
  border-color:#1769d2;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  font-weight:800;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

.primary{
  background:#1266d8;
  color:#fff;
}

.secondary{
  background:#e9edf2;
  color:#222;
}

.danger{
  background:#d9253d;
  color:#fff;
}

.hidden{
  display:none !important;
}

.message{
  min-height:24px;
  margin-top:12px;
  font-weight:700;
}

.success{
  color:#138a4b;
}

.error{
  color:#d9253d;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.login-box{
  max-width:500px;
  margin:50px auto;
}

/* SEARCH */

.search-row{
  display:flex;
  gap:10px;
}

.search-row input{
  flex:1;
}

/* PROFILE */

.profile{
  background:#fff;
  border:1px solid #dfe4eb;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}

.profile-name{
  font-size:21px;
  font-weight:900;
  margin-bottom:7px;
}

.profile-info{
  color:#626b77;
  line-height:1.8;
  font-size:14px;
}

.profile-photo{
  width:110px;
  height:110px;
  object-fit:cover;
  border-radius:12px;
  display:block;
  margin-bottom:12px;
}

/*
================================================
EDIT / DELETE BUTTON
================================================
*/

.profile-buttons{
  display:flex;
  align-items:center;
  gap:18px;
  margin-top:16px;
  width:100%;
}

.profile-buttons button{
  flex:1;
  min-height:50px;
  font-size:16px;
  position:relative;
  z-index:20;
}

.edit-button{
  background:#1266d8;
  color:#fff;
}

.delete-button{
  background:#d9253d;
  color:#fff;
}

/*
================================================
EDIT BOX
================================================
*/

.edit-box{
  margin-top:16px;
  padding:16px;
  border-radius:14px;
  background:#f5f9ff;
  border:2px solid #c5dcff;
}

.edit-title{
  font-size:18px;
  font-weight:900;
  margin-bottom:10px;
}

.edit-buttons{
  display:flex;
  gap:12px;
  margin-top:16px;
}

.edit-buttons button{
  flex:1;
}

/* MOBILE */

@media(max-width:600px){

  .container{
    padding:10px;
  }

  .card{
    padding:14px;
    border-radius:14px;
  }

  h1{
    font-size:22px;
  }

  .topbar{
    align-items:flex-start;
  }

  .search-row{
    flex-direction:column;
  }

  .search-row button{
    width:100%;
  }

  /*
  Edit/Delete পাশাপাশি থাকবে,
  কিন্তু touch area আলাদা থাকবে।
  */

  .profile-buttons{
    gap:16px;
  }

  .profile-buttons button{
    min-height:54px;
    padding:12px 8px;
  }

  .edit-buttons{
    flex-direction:column;
  }

  .edit-buttons button{
    width:100%;
  }

}

/* খুব ছোট স্ক্রিন */

@media(max-width:360px){

  .profile-buttons{
    gap:12px;
  }

  .profile-buttons button{
    font-size:14px;
  }

}
</style>
</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginSection">

<div class="container login-box">

<div class="card">

<h1>🔐 Admin Login</h1>

<p class="subtitle">
স্মৃতি সংরক্ষণ — Admin Dashboard
</p>

<form id="loginForm">

<label for="email">
Email
</label>

<input
  id="email"
  type="email"
  placeholder="Admin Email"
  autocomplete="username"
  required
>

<label for="password">
Password
</label>

<input
  id="password"
  type="password"
  placeholder="Password"
  autocomplete="current-password"
  required
>

<button
  type="submit"
  class="primary"
  style="width:100%;margin-top:16px;"
>
🔐 Login
</button>

</form>

<div id="loginMsg" class="message"></div>

</div>

</div>

</section>



<!-- =====================================================
     ADMIN PANEL
===================================================== -->

<main id="adminPanel" class="hidden">

<div class="container">


<!-- HEADER -->

<div class="card">

<div class="topbar">

<div>

<h1>স্মৃতি সংরক্ষণ</h1>

<div class="subtitle">
Admin Dashboard
</div>

</div>

<button
  id="logoutBtn"
  type="button"
  class="secondary"
>
Logout
</button>

</div>

</div>



<!-- ADD PROFILE -->

<div class="card">

<h2>➕ নতুন Profile যোগ করুন</h2>

<form id="profileForm">

<label>
নাম *
</label>

<input
  id="name"
  type="text"
  placeholder="নাম লিখুন"
  required
>

<label>
পিতা / স্বামীর নাম
</label>

<input
  id="father_husband"
  type="text"
  placeholder="পিতা / স্বামীর নাম"
>

<label>
ঠিকানা / গ্রাম
</label>

<input
  id="address"
  type="text"
  placeholder="গ্রাম / ঠিকানা"
>

<label>
বয়স
</label>

<input
  id="age"
  type="number"
  min="0"
  placeholder="বয়স"
>

<label>
মৃত্যুর তারিখ
</label>

<input
  id="death_date"
  type="date"
>

<label>
মৃত্যুর কারণ
</label>

<textarea
  id="death_reason"
  placeholder="মৃত্যুর কারণ লিখুন"
></textarea>

<label>
ছবি
</label>

<input
  id="photoFile"
  type="file"
  accept="image/*"
>

<button
  type="submit"
  class="primary"
  style="width:100%;margin-top:16px;"
>
💾 Profile সংরক্ষণ করুন
</button>

</form>

<div id="adminMsg" class="message"></div>

</div>



<!-- SEARCH -->

<div class="card">

<h2>🔎 Profile Search</h2>

<div class="search-row">

<input
  id="adminSearch"
  type="search"
  placeholder="নাম দিয়ে খুঁজুন..."
>

<button
  id="adminSearchBtn"
  type="button"
  class="primary"
>
🔎 Search
</button>

</div>

</div>



<!-- PROFILE LIST -->

<div class="card">

<h2>👥 Profiles</h2>

<div id="adminProfiles">
Profile লোড হচ্ছে...
</div>

</div>


</div>

</main>



<!-- =====================================================
     CONFIG
===================================================== -->

<script src="config.js"></script>



<script>

/* =====================================================
   SUPABASE
===================================================== */

let sb = null;

function getSupabase(){

  if(sb){
    return sb;
  }

  const url =
    window.SUPABASE_URL ||
    window.supabaseUrl ||
    window.SUPABASE_PROJECT_URL;

  const key =
    window.SUPABASE_ANON_KEY ||
    window.supabaseKey ||
    window.SUPABASE_KEY ||
    window.SUPABASE_PUBLISHABLE_KEY;

  if(!url || !key){

    throw new Error(
      "Supabase URL অথবা Key পাওয়া যায়নি। config.js পরীক্ষা করুন।"
    );

  }

  sb =
    window.supabase.createClient(
      url,
      key
    );

  return sb;
}



/* =====================================================
   ELEMENTS
===================================================== */

const loginSection =
  document.getElementById("loginSection");

const adminPanel =
  document.getElementById("adminPanel");

const loginForm =
  document.getElementById("loginForm");

const loginMsg =
  document.getElementById("loginMsg");

const logoutBtn =
  document.getElementById("logoutBtn");

const profileForm =
  document.getElementById("profileForm");

const adminMsg =
  document.getElementById("adminMsg");

const adminProfiles =
  document.getElementById("adminProfiles");

const adminSearch =
  document.getElementById("adminSearch");

const adminSearchBtn =
  document.getElementById("adminSearchBtn");



/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  element,
  text,
  type=""
){

  element.textContent = text;

  element.className =
    "message " + type;

}



/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    showMessage(
      loginMsg,
      "Login হচ্ছে..."
    );

    try{

      const supabase =
        getSupabase();

      const email =
        document
        .getElementById("email")
        .value
        .trim();

      const password =
        document
        .getElementById("password")
        .value;

      const result =
        await supabase.auth.signInWithPassword({

          email:email,

          password:password

        });


      if(result.error){

        throw result.error;

      }


      loginSection
        .classList
        .add("hidden");

      adminPanel
        .classList
        .remove("hidden");


      await loadProfiles();


    }catch(error){

      console.error(error);

      showMessage(
        loginMsg,
        "❌ Login ব্যর্থ: " +
        error.message,
        "error"
      );

    }

  }
);



/* =====================================================
   LOGOUT
===================================================== */

logoutBtn.addEventListener(
  "click",
  async function(){

    try{

      const supabase =
        getSupabase();

      await supabase.auth.signOut();

      adminPanel
        .classList
        .add("hidden");

      loginSection
        .classList
        .remove("hidden");

    }catch(error){

      console.error(error);

    }

  }
);



/* =====================================================
   SESSION
===================================================== */

async function checkSession(){

  try{

    const supabase =
      getSupabase();

    const result =
      await supabase.auth.getSession();

    if(result.data.session){

      loginSection
        .classList
        .add("hidden");

      adminPanel
        .classList
        .remove("hidden");

      await loadProfiles();

    }

  }catch(error){

    console.error(error);

    showMessage(
      loginMsg,
      error.message,
      "error"
    );

  }

}



/* =====================================================
   ADD PROFILE
===================================================== */

profileForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    showMessage(
      adminMsg,
      "Profile সংরক্ষণ হচ্ছে..."
    );


    try{

      const supabase =
        getSupabase();


      const name =
        document
        .getElementById("name")
        .value
        .trim();


      if(!name){

        throw new Error(
          "নাম দিতে হবে।"
        );

      }


      const father =
        document
        .getElementById("father_husband")
        .value
        .trim();


      const address =
        document
        .getElementById("address")
        .value
        .trim();


      const ageValue =
        document
        .getElementById("age")
        .value;


      const age =
        ageValue === ""
          ? null
          : Number(ageValue);


      const deathDate =
        document
        .getElementById("death_date")
        .value ||
        null;


      const deathReason =
        document
        .getElementById("death_reason")
        .value
        .trim();


      const dataToInsert = {

        name:name,

        father_husband:
          father || null,

        address:
          address || null,

        age:age,

        death_date:
          deathDate,

        death_reason:
          deathReason || null

      };


      /*
      -----------------------------------------------
      PHOTO
      -----------------------------------------------
      */

      const file =
        document
        .getElementById("photoFile")
        .files[0];


      if(file){

        try{

          const extension =
            file.name
            .split(".")
            .pop();


          const fileName =
            Date.now() +
            "_" +
            Math.random()
            .toString(36)
            .substring(2) +
            "." +
            extension;


          const upload =
            await supabase
            .storage
            .from("photos")
            .upload(
              fileName,
              file,
              {
                upsert:false
              }
            );


          if(!upload.error){

            const publicUrl =
              supabase
              .storage
              .from("photos")
              .getPublicUrl(fileName);


            dataToInsert.photo_url =
              publicUrl
              .data
              .publicUrl;

          }

        }catch(photoError){

          console.warn(
            "Photo upload সমস্যা:",
            photoError
          );

        }

      }


      /*
      -----------------------------------------------
      INSERT
      -----------------------------------------------
      */

      const result =
        await supabase
        .from("profiles")
        .insert(dataToInsert);


      if(result.error){

        throw result.error;

      }


      showMessage(
        adminMsg,
        "✅ Profile সফলভাবে যোগ হয়েছে।",
        "success"
      );


      profileForm.reset();

      await loadProfiles();


    }catch(error){

      console.error(error);

      showMessage(
        adminMsg,
        "❌ " + error.message,
        "error"
      );

    }

  }
);



/* =====================================================
   LOAD PROFILES
===================================================== */

async function loadProfiles(){

  adminProfiles.innerHTML =
    "<p>Profile লোড হচ্ছে...</p>";


  try{

    const supabase =
      getSupabase();


    const result =
      await supabase
      .from("profiles")
      .select("*")
      .order("id",{
        ascending:false
      });


    if(result.error){

      throw result.error;

    }


    window.allProfiles =
      result.data || [];


    renderProfiles(
      window.allProfiles
    );


  }catch(error){

    console.error(error);

    adminProfiles.innerHTML = `
      <div class="error">
        ❌ Profile লোড করা যায়নি।
        <br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

  }

}



/* =====================================================
   RENDER PROFILES
===================================================== */

function renderProfiles(list){

  if(!list || !list.length){

    adminProfiles.innerHTML =
      '<div class="empty">কোনো Profile পাওয়া যায়নি।</div>';

    return;

  }


  adminProfiles.innerHTML =
    list.map(function(profile){

      const id =
        String(profile.id);


      const father =
        profile.father_husband ||
        profile.father ||
        "—";


      const address =
        profile.address ||
        profile.village ||
        "—";


      const age =
        profile.age == null
          ? "—"
          : profile.age + " বছর";


      const date =
        profile.death_date ||
        "—";


      const reason =
        profile.death_reason ||
        profile.death_cause ||
        "";


      let photoHTML = "";

      if(profile.photo_url){

        photoHTML = `

          <img
            class="profile-photo"
            src="${escapeAttr(profile.photo_url)}"
            alt=""
            onerror="this.style.display='none'"
          >

        `;

      }


      return `

        <div class="profile">

          ${photoHTML}


          <div class="profile-name">
            ${escapeHtml(profile.name || "নাম নেই")}
          </div>


          <div class="profile-info">

            পিতা / স্বামী:
            ${escapeHtml(father)}
            <br>

            ঠিকানা:
            ${escapeHtml(address)}
            <br>

            বয়স:
            ${escapeHtml(age)}
            <br>

            মৃত্যুর তারিখ:
            ${escapeHtml(date)}

            ${
              reason
              ?
              `
              <br>
              মৃত্যুর কারণ:
              ${escapeHtml(reason)}
              `
              :
              ""
            }

          </div>



          <!-- =========================================
               TWO SEPARATE BUTTONS
          ========================================== -->

          <div class="profile-buttons">

            <button
              type="button"
              class="edit-button"
              data-action="edit"
              data-id="${escapeAttr(id)}"
            >
              ✏️ Edit
            </button>


            <button
              type="button"
              class="delete-button"
              data-action="delete"
              data-id="${escapeAttr(id)}"
            >
              🗑️ Delete
            </button>

          </div>



          <!-- =========================================
               EDIT BOX
          ========================================== -->

          <div
            id="editBox-${escapeAttr(id)}"
            class="edit-box hidden"
          >

            <div class="edit-title">
              ✏️ Profile Edit করুন
            </div>


            <label>
              নাম
            </label>

            <input
              id="editName-${escapeAttr(id)}"
              value="${escapeAttr(profile.name || "")}"
            >


            <label>
              পিতা / স্বামীর নাম
            </label>

            <input
              id="editFather-${escapeAttr(id)}"
              value="${escapeAttr(father === "—" ? "" : father)}"
            >


            <label>
              ঠিকানা / গ্রাম
            </label>

            <input
              id="editAddress-${escapeAttr(id)}"
              value="${escapeAttr(address === "—" ? "" : address)}"
            >


            <label>
              বয়স
            </label>

            <input
              id="editAge-${escapeAttr(id)}"
              type="number"
              min="0"
              value="${profile.age == null ? "" : escapeAttr(String(profile.age))}"
            >


            <label>
              মৃত্যুর তারিখ
            </label>

            <input
              id="editDate-${escapeAttr(id)}"
              type="date"
              value="${escapeAttr(profile.death_date || "")}"
            >


            <label>
              মৃত্যুর কারণ
            </label>

            <textarea
              id="editReason-${escapeAttr(id)}"
            >${escapeHtml(reason)}</textarea>



            <div class="edit-buttons">

              <button
                type="button"
                class="primary"
                data-action="save"
                data-id="${escapeAttr(id)}"
              >
                💾 Save Changes
              </button>


              <button
                type="button"
                class="secondary"
                data-action="cancel"
                data-id="${escapeAttr(id)}"
              >
                Cancel
              </button>

            </div>

          </div>

        </div>

      `;

    }).join("");


}



/* =====================================================
   BUTTON EVENT HANDLER
   এখানে একসাথে touch হওয়ার সমস্যা থাকবে না।
===================================================== */

adminProfiles.addEventListener(
  "click",
  function(event){

    const button =
      event.target.closest("button[data-action]");


    if(!button){

      return;

    }


    const action =
      button.dataset.action;


    const id =
      button.dataset.id;


    /*
    Edit
    */

    if(action ==
